name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------
  # Makefile builds of the Vulkan backend, unit tests (plain and ASan)
  # ---------------------------------------------------------------
  make:
    name: Make, unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential glslang-tools libvulkan-dev xxd libglfw3-dev zlib1g-dev python3
      - name: Build vkmmc
        run: make -C src -j$(nproc)
      - name: Smoke test (no GPU)
        run: bash .github/ci/smoke.sh bin/vkmmc
      - name: Build with the viewer and the system zlib
        run: |
          make -C src clean
          make -C src -j$(nproc) SHOW=1 HAVE_ZLIB=yes
          bash .github/ci/smoke.sh bin/vkmmc
      - name: Unit tests
        run: make -C tests/unit run
      - name: Unit tests with AddressSanitizer and UBSan
        run: make -C tests/unit asan
      - name: Unit test coverage
        run: make -C tests/unit coverage

  # ---------------------------------------------------------------
  # CMake build and ctest (tests that need no GPU)
  # ---------------------------------------------------------------
  cmake:
    name: CMake (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build glslang-tools libvulkan-dev libglfw3-dev python3
      - name: Configure
        run: cmake -S . -B build -G Ninja -DVKMMC_SHOW=ON -DVKMMC_BUILD_OPTIX=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -LE gpu --output-on-failure

  # ---------------------------------------------------------------
  # Windows (MSVC) and macOS (Intel and Apple Silicon): the LunarG Vulkan
  # SDK, CMake build, unit and smoke tests. macOS has no Vulkan ray-query
  # driver (MoltenVK lacks it), so no simulation runs there; on Windows the
  # functional suite is tried on Mesa's lavapipe
  # ---------------------------------------------------------------
  cross:
    name: CMake (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          install_lavapipe: ${{ runner.os == 'Windows' }}
          cache: true
          stripdown: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Put the Vulkan loader and glslangValidator on PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          # GITHUB_PATH needs Windows paths for the native programs ctest starts
          cygpath -w "$(cygpath -u "$VULKAN_SDK")/Bin" >> "$GITHUB_PATH"
          dll=$(find "$(cygpath -u "$VULKAN_SDK")" /c/VulkanSDK -name vulkan-1.dll 2>/dev/null | head -1)
          echo "vulkan-1.dll: $dll"
          [ -n "$dll" ] || { echo "vulkan-1.dll not found"; exit 1; }
          cygpath -w "$(cd "$(dirname "$dll")" && pwd)" | tee -a "$GITHUB_PATH"
      - name: Configure
        run: cmake -S . -B build -DVKMMC_BUILD_OPTIX=OFF -DCMAKE_BUILD_TYPE=Release -DVKMMC_STATIC_RUNTIME=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit and smoke tests
        run: ctest --test-dir build -C Release -LE gpu --output-on-failure
      - name: Create the package
        run: |
          tag=$(echo "${{ runner.os }}-${{ runner.arch }}-github-latest" | tr '[:upper:]' '[:lower:]')
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          for exe in build/bin/Release/vkmmc.exe build/bin/vkmmc; do [ -f "$exe" ] && break; done
          bash .github/ci/package.sh "$tag" "$exe"
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: all-vkmmc-packages-${{ env.RELEASE_TAG }}
          path: packages/vkmmc-${{ env.RELEASE_TAG }}.zip
      - name: Functional tests on lavapipe (Windows, experimental)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          icd=$(find /c/lavapipe -name '*.json' 2>/dev/null | head -1)
          echo "lavapipe ICD: $icd"
          export VK_DRIVER_FILES="$(cygpath -w "$icd")" VK_ICD_FILENAMES="$(cygpath -w "$icd")"
          # the scripts call python3
          mkdir -p ~/bin && printf '#!/bin/sh\nexec python "$@"\n' > ~/bin/python3 && chmod +x ~/bin/python3
          export PATH=~/bin:$PATH
          for exe in build/bin/Release/vkmmc.exe build/bin/vkmmc.exe; do [ -f "$exe" ] && break; done
          "$exe" -L
          cd tests && ./test_vkmmc.sh "../$exe"

  # ---------------------------------------------------------------
  # The full functional suite on the CPU: Mesa's lavapipe implements
  # Vulkan ray query (tested with Mesa 25.0 and 26.0; here Ubuntu 26.04)
  # ---------------------------------------------------------------
  vulkan-lavapipe:
    name: Vulkan functional tests (lavapipe)
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git build-essential cmake glslang-tools libvulkan-dev \
              xxd python3 mesa-vulkan-drivers
      - uses: actions/checkout@v4
      - name: Build vkmmc
        run: make -C src -j$(nproc)
      - name: List the Vulkan devices
        run: bin/vkmmc -L
      - name: Functional tests
        run: cd tests && ./test_vkmmc.sh ../bin/vkmmc
      - name: CMake build and ctest including the GPU suite
        run: |
          cmake -S . -B build -DVKMMC_BUILD_OPTIX=OFF
          cmake --build build -j$(nproc)
          ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------
  # OptiX backend: CUDA 11.7 redistributables and the optix-dev headers;
  # the CUDA runtime is linked statically (no GPU on the runner)
  # ---------------------------------------------------------------
  optix:
    name: OptiX build (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake xxd python3 curl xz-utils
      - name: Fetch CUDA 11.7 and the OptiX 7.5 headers
        run: bash .github/ci/fetch_cuda_optix.sh | tee -a "$GITHUB_ENV"
      - name: Build vkmmc_optix (Makefile)
        run: make -C optix STATIC=1 CUDA_DIR=$CUDA_DIR OPTIX_DIR=$OPTIX_DIR
      - name: Check the run-time dependencies
        run: bash .github/ci/check_deps.sh bin/vkmmc_optix libm.so libc.so libdl.so libpthread.so librt.so ld-linux
      - name: Smoke test (no GPU)
        run: bash .github/ci/smoke.sh bin/vkmmc_optix
      - name: Build vkmmc_optix (CMake) and ctest
        run: |
          cmake -S . -B build -DVKMMC_BUILD_VULKAN=OFF -DVKMMC_BUILD_OPTIX=ON -DOPTIX_ROOT=$OPTIX_DIR \
                -DCUDAToolkit_ROOT=$CUDA_DIR -DVKMMC_STATIC_RUNTIME=ON
          cmake --build build -j$(nproc)
          bash .github/ci/check_deps.sh build/bin/vkmmc_optix libm.so libc.so libdl.so libpthread.so librt.so ld-linux
          ctest --test-dir build -LE gpu --output-on-failure
      - name: Upload vkmmc_optix
        uses: actions/upload-artifact@v4
        with:
          name: vkmmc_optix-linux-x86_64
          path: bin/vkmmc_optix

  # ---------------------------------------------------------------
  # Fuzzing: replay past findings, then a short libFuzzer round and
  # mutation fuzzing of the sanitized binary
  # ---------------------------------------------------------------
  fuzz:
    name: Fuzzing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang glslang-tools libvulkan-dev xxd python3
      - name: Replay the regression corpus
        run: make -C tests/fuzz regress
      - name: libFuzzer (60 s per harness)
        run: make -C tests/fuzz run T=60 JOBS=$(nproc)
      - name: Mutation fuzzing of the sanitized front-end
        run: |
          make -C src asan -j$(nproc)
          python3 tests/fuzz/fuzz_vkmmc.py bin/vkmmc_asan -n 500 --seed ${{ github.run_number }}
      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: |
            tests/fuzz/findings*/

  # ---------------------------------------------------------------
  # Release binaries built in manylinux2014 (glibc 2.17): vkmmc and
  # vkmmc_optix with libstdc++/libgcc/cudart static; attached to the
  # GitHub release when a v* tag is pushed
  # ---------------------------------------------------------------
  release:
    name: Release binaries (manylinux2014)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools xxd
      - name: Compile the SPIR-V kernels on the host
        run: make -C src vkmmc_core_spv.h
      - name: Cache the Vulkan loader, CUDA and OptiX headers
        uses: actions/cache@v4
        with:
          path: .deps
          key: manylinux-deps-${{ hashFiles('.github/ci/manylinux_build.sh', '.github/ci/fetch_cuda_optix.sh') }}
      - name: Build in manylinux2014
        run: |
          docker run --rm -e HOST_UID=$(id -u) -v "$PWD:/src" -w /src quay.io/pypa/manylinux2014_x86_64 \
              bash .github/ci/manylinux_build.sh
      - name: Create the package
        run: |
          tag=$(echo "${{ runner.os }}-${{ runner.arch }}-github-latest" | tr '[:upper:]' '[:lower:]')
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          bash .github/ci/package.sh "$tag" bin/vkmmc bin/vkmmc_optix
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: all-vkmmc-packages-${{ env.RELEASE_TAG }}
          path: packages/vkmmc-${{ env.RELEASE_TAG }}.zip
      - name: Upload the release tarball
        uses: actions/upload-artifact@v4
        with:
          name: vkmmc-linux-x86_64
          path: dist/*.tar.gz
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz

  # ---------------------------------------------------------------
  # Copy the packages (vkmmc-<os>-<arch>-github-latest.zip) to the
  # download server, as the mcx/mcxcl/mmc workflows do
  # ---------------------------------------------------------------
  upload_package:
    name: Upload packages
    needs: [release, cross]
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() && github.repository_owner == 'fangq' && github.actor == 'fangq' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          pattern: all-vkmmc-packages-*
          merge-multiple: true
          path: packages
      - name: List the packages
        run: ls -lR packages
      - name: Copy the packages to the server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.MCX_SERVER }}
          username: ${{ secrets.MCX_SERVER_USER }}
          ssh_private_key: ${{ secrets.MCX_SERVER_SSH_KEY }}
          local_path: "packages/*"
          remote_path: ${{ secrets.MCX_CI_PATH }}
